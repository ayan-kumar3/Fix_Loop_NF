<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-label="Waste Management">
  <defs>
    <linearGradient id="g-waste" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15803d"/>
      <stop offset="1" stop-color="#052e16"/>
    </linearGradient>
    <radialGradient id="v-waste" cx="0.5" cy="0.4" r="0.8">
      <stop offset="0.4" stop-color="rgba(255,255,255,0.10)"/>
      <stop offset="1" stop-color="rgba(0,0,0,0.35)"/>
    </radialGradient>
    <pattern id="grid-waste" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="480" height="360" fill="url(#g-waste)"/>
  <rect width="480" height="360" fill="url(#grid-waste)"/>
  <rect width="480" height="360" fill="url(#v-waste)"/>
  <g transform="translate(240 150)" text-anchor="middle">
    <circle r="58" fill="rgba(0,0,0,0.28)"/>
    <text y="20" font-size="60">♻️</text>
  </g>
  <text x="24" y="330" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="rgba(255,255,255,0.92)">Waste Management</text>
  <text x="24" y="350" font-family="Inter, Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.6)">FixLoop demo evidence</text>
</svg>